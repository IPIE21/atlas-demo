<style>/* Atlas · "night survey" direction.
   Layout: an open sky. The backdrop (a topographic map under an aurora) fills the screen and shows between
   everything. Glass is spent only where reading needs it: the rail, the ribbon, two list instruments and the
   drawers. The greeting, next action, money ring and fitness bars sit straight on the sky.
   Type: system faces only (Atlas makes no network requests). Mono carries the HUD voice: labels, times, numbers.
   Dark-first; a daylight variant swaps the tokens. */
:root {
  --bg: #05070d; --sky-top: #0a0f1f; --sky-bottom: #03050a;
  --contour: rgba(160, 190, 255, 0.075); --contour-index: rgba(200, 242, 90, 0.16);
  --aurora-1: rgba(124, 92, 255, 0.30); --aurora-2: rgba(80, 220, 200, 0.16); --aurora-3: rgba(200, 242, 90, 0.14);
  --star: #dfe8ff; --star-alpha: 0.75;
  --ink: #eef2fa; --muted: #aab4c8; --faint: #8994ab;
  --accent: #c8f25a; --accent-ink: #10150a; --accent-glow: rgba(200, 242, 90, 0.35);
  --violet: #a48bff; --teal: #62e3cf;
  --glass: rgba(14, 18, 32, 0.62); --glass-strong: rgba(12, 15, 27, 0.82); --glass-line: rgba(255, 255, 255, 0.10); --glass-hi: rgba(255, 255, 255, 0.06);
  --field: rgba(255, 255, 255, 0.06); --field-line: rgba(255, 255, 255, 0.14);
  --ring-track: rgba(255, 255, 255, 0.10);
  --hard: #ff8f80; --hard-soft: rgba(255, 110, 90, 0.16); --pref: #ffcd6b; --pref-soft: rgba(255, 190, 70, 0.15); --flex: #9cc8ff; --flex-soft: rgba(120, 170, 255, 0.15);
  --warn: #ffcd6b; --warn-soft: rgba(255, 190, 70, 0.14); --ok: #a9e77a; --ok-soft: rgba(160, 230, 110, 0.14); --none-soft: rgba(255, 255, 255, 0.08);
  --demo: #f2cf5b; --demo-ink: #1d1600;
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI Variable Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Segoe UI Mono", Consolas, monospace;
  --r: 20px; --r-sm: 12px; --blur: 18px;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 36px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #dfe8f3; --sky-top: #cfdcef; --sky-bottom: #eef3fa;
  --contour: rgba(40, 70, 130, 0.10); --contour-index: rgba(70, 60, 200, 0.18);
  --aurora-1: rgba(140, 120, 255, 0.28); --aurora-2: rgba(90, 200, 230, 0.22); --aurora-3: rgba(255, 255, 255, 0.55);
  --star: #ffffff; --star-alpha: 0;
  --ink: #0f1a2c; --muted: #43506a; --faint: #55617a;
  --accent: #4b36d6; --accent-ink: #ffffff; --accent-glow: rgba(75, 54, 214, 0.25);
  --violet: #5b3fd6; --teal: #0f7f74;
  --glass: rgba(255, 255, 255, 0.62); --glass-strong: rgba(255, 255, 255, 0.84); --glass-line: rgba(255, 255, 255, 0.75); --glass-hi: rgba(255, 255, 255, 0.5);
  --field: rgba(255, 255, 255, 0.7); --field-line: rgba(30, 50, 90, 0.18);
  --ring-track: rgba(30, 50, 90, 0.12);
  --hard: #a3271b; --hard-soft: rgba(200, 50, 30, 0.12); --pref: #7a4d00; --pref-soft: rgba(230, 160, 30, 0.18); --flex: #24527e; --flex-soft: rgba(60, 120, 200, 0.14);
  --warn: #7a4d00; --warn-soft: rgba(230, 160, 30, 0.18); --ok: #1f6a36; --ok-soft: rgba(60, 170, 90, 0.15); --none-soft: rgba(30, 50, 90, 0.08);
  --demo: #f2cf5b; --demo-ink: #1d1600; color-scheme: light; } }
:root[data-theme="light"] {
  --bg: #dfe8f3; --sky-top: #cfdcef; --sky-bottom: #eef3fa;
  --contour: rgba(40, 70, 130, 0.10); --contour-index: rgba(70, 60, 200, 0.18);
  --aurora-1: rgba(140, 120, 255, 0.28); --aurora-2: rgba(90, 200, 230, 0.22); --aurora-3: rgba(255, 255, 255, 0.55);
  --star: #ffffff; --star-alpha: 0;
  --ink: #0f1a2c; --muted: #43506a; --faint: #55617a;
  --accent: #4b36d6; --accent-ink: #ffffff; --accent-glow: rgba(75, 54, 214, 0.25);
  --violet: #5b3fd6; --teal: #0f7f74;
  --glass: rgba(255, 255, 255, 0.62); --glass-strong: rgba(255, 255, 255, 0.84); --glass-line: rgba(255, 255, 255, 0.75); --glass-hi: rgba(255, 255, 255, 0.5);
  --field: rgba(255, 255, 255, 0.7); --field-line: rgba(30, 50, 90, 0.18);
  --ring-track: rgba(30, 50, 90, 0.12);
  --hard: #a3271b; --hard-soft: rgba(200, 50, 30, 0.12); --pref: #7a4d00; --pref-soft: rgba(230, 160, 30, 0.18); --flex: #24527e; --flex-soft: rgba(60, 120, 200, 0.14);
  --warn: #7a4d00; --warn-soft: rgba(230, 160, 30, 0.18); --ok: #1f6a36; --ok-soft: rgba(60, 170, 90, 0.15); --none-soft: rgba(30, 50, 90, 0.08);
  --demo: #f2cf5b; --demo-ink: #1d1600; color-scheme: light; }

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font); margin: 0; -webkit-font-smoothing: antialiased; }
#sky { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
body::after { content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none; background: radial-gradient(120% 90% at 50% 10%, transparent 40%, color-mix(in srgb, var(--sky-bottom) 70%, transparent) 100%); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--glass-strong); }
#app { position: relative; z-index: 1; min-height: 100vh; padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
a { color: var(--accent); }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* Glass, used selectively */
.glass, .sec, .card.list-card, .sheet, .welcome, .src, .score, .top, .tabbar {
  background: var(--glass); border: 1px solid var(--glass-line); border-radius: var(--r);
  -webkit-backdrop-filter: blur(var(--blur)) saturate(140%); backdrop-filter: blur(var(--blur)) saturate(140%);
  box-shadow: inset 0 1px 0 var(--glass-hi), 0 18px 50px rgba(0, 0, 0, 0.18);
}
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .glass, .sec, .card.list-card, .sheet, .welcome, .src, .score, .top, .tabbar { background: var(--glass-strong); } }
/* HUD brackets: four corner ticks, the one futuristic flourish, used on the rail only */
.hud-frame { position: relative; }
.hud-frame::before, .hud-frame::after { content: ""; position: absolute; width: 14px; height: 14px; border: 2px solid var(--accent); pointer-events: none; opacity: .8; }
.hud-frame::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; border-top-left-radius: var(--r); }
.hud-frame::after { bottom: -1px; right: -1px; border-left: 0; border-top: 0; border-bottom-right-radius: var(--r); }
.hud { font: 650 .72rem/1.3 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); display: inline-flex; align-items: center; gap: 8px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent-glow); display: inline-block; }
.dot.ok { background: var(--ok); box-shadow: 0 0 10px var(--ok); }

/* Top bar */
.demo-band { position: relative; z-index: 6; background: repeating-linear-gradient(135deg, var(--demo) 0 14px, color-mix(in srgb, var(--demo) 82%, #000) 14px 28px); color: var(--demo-ink); font-weight: 750; font-size: .84rem; padding: 6px max(16px, env(safe-area-inset-right, 0px)) 6px max(16px, env(safe-area-inset-left, 0px)); text-align: center; }
.demo-band .link { color: inherit; }
.demo-band .short { display: none; }
.top { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 10px); z-index: 5; display: flex; align-items: center; gap: var(--s4); margin: 10px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); padding: 8px 10px 8px 14px; border-radius: 16px; background: var(--glass-strong); }
.brand { display: flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; font: 800 1rem var(--font); letter-spacing: .02em; }
.mark { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); font-weight: 900; box-shadow: 0 0 18px var(--accent-glow); }
.nav { display: flex; gap: 2px; margin-left: var(--s3); }
.nav a, .tabbar a, .gear { color: var(--muted); text-decoration: none; font-weight: 650; padding: 8px 13px; border-radius: 10px; min-height: 42px; display: inline-flex; align-items: center; gap: 6px; }
.nav a.on, .tabbar a.on, .gear.on { color: var(--ink); background: var(--field); box-shadow: inset 0 -2px 0 var(--accent); }
.nav a:hover, .gear:hover { color: var(--ink); }
.top-acts { margin-left: auto; display: flex; gap: var(--s2); align-items: center; }
.count { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px; background: var(--hard); color: var(--bg); font: 700 .72rem var(--mono); }
.tabbar { display: none; }

main { position: relative; max-width: 1240px; margin: 0 auto; padding: var(--s6) max(16px, env(safe-area-inset-right, 0px)) var(--s6) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: var(--s5); outline: none; }

/* Buttons, chips */
.btn { appearance: none; border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font: 750 .92rem var(--font); padding: 10px 18px; min-height: 44px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 6px 24px var(--accent-glow); }
.btn:hover { filter: brightness(1.06); }
.btn.ghost { background: var(--field); color: var(--ink); box-shadow: inset 0 0 0 1px var(--field-line); }
.btn.sm { min-height: 36px; padding: 6px 12px; font-size: .84rem; box-shadow: none; }
.btn.danger { background: var(--hard); color: var(--bg); box-shadow: none; }
.danger-text { color: var(--hard) !important; }
.btn.file { position: relative; overflow: hidden; }
.btn.file input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.link { appearance: none; background: none; border: 0; padding: 0; color: var(--accent); font: inherit; font-weight: 650; text-decoration: underline; cursor: pointer; }
.actions { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; }
.pill { appearance: none; display: inline-flex; align-items: center; gap: 8px; min-height: 42px; padding: 8px 16px; border-radius: 99px; border: 1px solid var(--glass-line); background: var(--glass); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); color: var(--ink); font: 650 .9rem var(--font); text-decoration: none; cursor: pointer; }
.pill span { color: var(--accent); font-weight: 800; }
.pill:hover { border-color: var(--accent); }
.chip, .cap { display: inline-flex; align-items: center; border-radius: 99px; padding: 2px 9px; font: 700 .72rem var(--font); letter-spacing: .02em; background: var(--none-soft); color: var(--muted); white-space: nowrap; }
.firm-hard { background: var(--hard-soft); color: var(--hard); }
.firm-preferred { background: var(--pref-soft); color: var(--pref); }
.firm-flexible { background: var(--flex-soft); color: var(--flex); }
.chip.now { background: var(--ok-soft); color: var(--ok); }
.q-verified { background: var(--ok-soft); color: var(--ok); }
.q-stale { background: var(--warn-soft); color: var(--warn); }
.q-demo { background: var(--demo); color: var(--demo-ink); }
.cap-light { background: var(--ok-soft); color: var(--ok); }
.cap-full { background: var(--pref-soft); color: var(--pref); }
.cap-overloaded { background: var(--hard-soft); color: var(--hard); }
.stamp { font: 600 .7rem var(--mono); letter-spacing: .04em; color: var(--muted); white-space: nowrap; }
.stamp.stale { color: var(--warn); background: var(--warn-soft); padding: 2px 7px; border-radius: 6px; }
.stamp.demo { color: var(--demo-ink); background: var(--demo); padding: 2px 7px; border-radius: 6px; }

/* Shared page pieces */
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: var(--s3); flex-wrap: wrap; }
.eyebrow { font: 650 .72rem var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.page-title { font-size: clamp(2rem, 4vw, 2.8rem); line-height: 1.02; letter-spacing: -.035em; font-weight: 800; text-shadow: 0 2px 30px rgba(0, 0, 0, .35); }
.card { min-width: 0; }
.fine { font-size: .84rem; color: var(--muted); }
.warn { color: var(--warn); }
.late { color: var(--hard); font-weight: 650; }
.banner { padding: 10px 14px; border-radius: var(--r-sm); background: var(--glass-strong); border: 1px solid var(--glass-line); }
.banner.warn { color: var(--warn); }
.empty { color: var(--muted); }

/* ===== Today: open sky ===== */
.sky-head { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 380px); gap: var(--s6); align-items: start; }
.open { display: grid; gap: var(--s4); min-width: 0; padding-top: var(--s2); }
.stamp-line { flex-wrap: wrap; gap: 6px 18px; }
.stamp-line .sys { color: var(--ok); }
.greet { font-size: clamp(2.3rem, 5.4vw, 4.2rem); line-height: .98; letter-spacing: -.045em; font-weight: 800; text-shadow: 0 2px 40px rgba(0, 0, 0, .45); max-width: 16ch; }
.hero { display: grid; gap: var(--s3); max-width: 680px; padding: var(--s5); border-radius: var(--r); background: linear-gradient(135deg, color-mix(in srgb, var(--glass-strong) 92%, var(--accent)), var(--glass-strong)); border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--glass-line)); -webkit-backdrop-filter: blur(var(--blur)); backdrop-filter: blur(var(--blur)); box-shadow: 0 0 0 1px rgba(0, 0, 0, .05), 0 20px 60px rgba(0, 0, 0, .25), 0 0 60px -20px var(--accent-glow); }
.hero .hud { color: var(--accent); }
.hero-title { font-size: clamp(1.4rem, 2.6vw, 2rem); line-height: 1.12; font-weight: 800; letter-spacing: -.02em; overflow-wrap: anywhere; }
.hero-meta { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-weight: 600; color: var(--muted); }
.then { border-top: 1px solid var(--glass-line); padding-top: var(--s3); display: grid; gap: 6px; }
.then .hud { color: var(--muted); }
.then ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; counter-reset: t; }
.then li { display: flex; justify-content: space-between; gap: 12px; font-weight: 600; }
.then li::before { counter-increment: t; content: "0" counter(t); font: 600 .72rem var(--mono); color: var(--faint); padding-top: 3px; margin-right: -4px; }
.then li span:first-of-type { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.then .meta { color: var(--muted); font: 500 .8rem var(--mono); white-space: nowrap; padding-top: 2px; }
.dock { display: flex; flex-wrap: wrap; gap: var(--s2); }

/* Rail */
.rail { padding: var(--s5); display: grid; gap: var(--s4); min-width: 0; }
.rail-top { display: flex; gap: var(--s4); align-items: center; }
.ring-wrap { position: relative; flex: none; width: 92px; height: 92px; }
.ring-wrap .ring { width: 92px; height: 92px; }
.ring-num { position: absolute; inset: 0; display: grid; place-items: center; font: 750 1.2rem var(--mono); }
.rail-stat { font: 750 1.25rem var(--font); letter-spacing: -.01em; }
.ring circle:last-child { filter: drop-shadow(0 0 6px var(--accent-glow)); }
.glance { display: grid; gap: var(--s2); border-top: 1px solid var(--glass-line); padding-top: var(--s4); }
.glance h3 { color: var(--ink); }
.lines { list-style: none; padding: 0; margin: 0; display: grid; gap: var(--s2); }
.lines li { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 12px; }
.lines li > :first-child { min-width: 0; overflow-wrap: anywhere; }
.lines .meta { color: var(--muted); font: 500 .8rem var(--mono); display: inline-flex; gap: 6px; align-items: center; }
.lines.ticks .meta { flex: none; white-space: nowrap; }
.lines .meta.late { color: var(--hard); }
.rail .lines a { color: var(--ink); text-decoration-color: var(--accent); text-underline-offset: 3px; }

/* Ribbon */
.ribbon { padding: var(--s4) var(--s5) var(--s4); display: grid; gap: var(--s3); }
.ribbon-head { display: flex; justify-content: space-between; gap: var(--s3); flex-wrap: wrap; align-items: center; }
.track { position: relative; height: 64px; margin: 18px 0 4px; border-radius: 10px; background: repeating-linear-gradient(90deg, transparent 0 calc(100% / 48 - 1px), var(--glass-line) calc(100% / 48 - 1px) calc(100% / 48)); border: 1px solid var(--glass-line); }
.tick-h { position: absolute; top: -20px; height: calc(100% + 20px); border-left: 1px solid var(--field-line); }
.tick-h i { position: absolute; top: 0; left: 4px; font: 600 .66rem var(--mono); font-style: normal; color: var(--muted); white-space: nowrap; }
.seg-ev { position: absolute; top: 8px; height: 30px; min-width: 6px; border-radius: 8px; background: color-mix(in srgb, var(--violet) 32%, transparent); border: 1px solid color-mix(in srgb, var(--violet) 70%, transparent); overflow: hidden; display: flex; align-items: center; padding: 0 8px; }
.seg-ev b { font: 650 .74rem var(--font); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); }
.seg-ev.past { opacity: .6; }
.timeline.ribbon-list { display: none; }
.ribbon-list li.past .e { color: var(--muted); }
.seg-plan { position: absolute; bottom: 7px; height: 12px; border-radius: 4px; background: color-mix(in srgb, var(--accent) 55%, transparent); border: 1px solid var(--accent); }
.now-mark { position: absolute; top: -6px; bottom: -6px; width: 2px; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
.now-mark i { position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%); font: 700 .64rem var(--mono); font-style: normal; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); background: var(--glass-strong); padding: 0 4px; border-radius: 4px; }
.ribbon-foot { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; padding-top: 8px; font-weight: 600; }
.ribbon-foot .hud { color: var(--accent); }

/* Instruments: four different shapes on one 12-column line */
.instruments { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: var(--s5) var(--s6); align-items: start; }
.inst { min-width: 0; display: grid; gap: var(--s3); }
.inst > header { display: flex; justify-content: space-between; align-items: center; gap: var(--s2); flex-wrap: wrap; }
.inst.glass { padding: var(--s4) var(--s5); }
.inst-assign { grid-column: 1 / 8; grid-row: 1 / 3; }
.inst-money { grid-column: 8 / 13; grid-row: 1; }
.inst-fit { grid-column: 8 / 13; grid-row: 2; }
.inst-follow { grid-column: 5 / 13; grid-row: 3; }
.open-sky { padding: var(--s2) var(--s2); }
.open-sky .hud { color: var(--ink); }
.alist, .flist { list-style: none; margin: 0; padding: 0; display: grid; }
.alist li, .flist li { display: flex; gap: var(--s3); align-items: center; padding: 10px 0; border-top: 1px solid var(--glass-line); }
.alist li:first-child, .flist li:first-child { border-top: 0; }
.a-day { flex: none; width: 4.4rem; display: grid; font-family: var(--mono); line-height: 1.2; }
.a-day b { font-size: .8rem; font-weight: 700; }
.a-day i { font-style: normal; font-size: .7rem; color: var(--muted); }
.alist li.overdue .a-day b { color: var(--hard); }
.a-main, .f-main { display: grid; gap: 1px; min-width: 0; flex: 1; }
.a-title { font-weight: 650; overflow-wrap: anywhere; }
.a-meta { font-size: .8rem; color: var(--muted); }
.flist li { padding-left: 12px; position: relative; }
.flist li::before { content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; width: 3px; border-radius: 3px; background: var(--faint); }
.flist li.st-follow-up::before { background: var(--accent); box-shadow: 0 0 10px var(--accent-glow); }
.flist li.st-quoted::before { background: var(--violet); }
.gauge { position: relative; width: 148px; height: 148px; }
.gauge-c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.gauge-c b { font: 750 1.35rem var(--mono); letter-spacing: -.02em; text-shadow: 0 2px 16px rgba(0, 0, 0, .4); }
.gauge-c span { font-size: .74rem; color: var(--muted); }
.inst-money { grid-template-columns: auto minmax(0, 1fr); column-gap: var(--s5); align-items: center; }
.inst-money > .hud, .inst-money > .fine, .inst-money > .sky-empty { grid-column: 1 / -1; }
.mini { margin: 0; display: grid; gap: var(--s3); }
.mini div { display: grid; }
.mini dt { font: 600 .68rem var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.mini dd { margin: 0; font: 750 1.2rem var(--mono); text-shadow: 0 2px 16px rgba(0, 0, 0, .4); }
.sky-empty { display: grid; gap: var(--s2); justify-items: start; color: var(--muted); }
.fit-num { font-size: .95rem; color: var(--muted); }
.fit-num b { font: 800 2.4rem/1 var(--mono); color: var(--ink); letter-spacing: -.03em; text-shadow: 0 2px 20px rgba(0, 0, 0, .45); margin-right: 4px; }
.bars { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; height: 150px; align-items: end; border-bottom: 1px solid var(--field-line); padding-bottom: 0; }
.bar-col { height: 100%; display: grid; grid-template-rows: 1fr auto; align-items: end; justify-items: center; gap: 6px; }
.bar-v { width: 100%; max-width: 46px; border-radius: 10px 10px 3px 3px; background: linear-gradient(180deg, var(--accent), color-mix(in srgb, var(--accent) 35%, transparent)); position: relative; box-shadow: 0 0 24px -6px var(--accent-glow); }
.bar-v i { position: absolute; top: -18px; left: 50%; transform: translateX(-50%); font: 650 .68rem var(--mono); font-style: normal; color: var(--ink); }
.bar-col em { font: 650 .7rem var(--mono); font-style: normal; color: var(--muted); padding-bottom: 6px; transform: translateY(22px); }
.bar-col.today em { color: var(--accent); }
.bar-col.future .bar-v { background: none; box-shadow: none; border-top: 1px dashed var(--field-line); height: 1px !important; }
.inst-fit .bars { margin-bottom: 22px; }
.inst-fit .pill { justify-self: start; }

/* Drawers and generic sections */
.drawers { display: grid; gap: var(--s3); }
.sec { min-width: 0; border-radius: 16px; }
.sec > summary { list-style: none; display: flex; align-items: center; gap: var(--s3); padding: 14px var(--s4); cursor: pointer; min-height: 52px; flex-wrap: wrap; }
.sec > summary::-webkit-details-marker { display: none; }
.sec-title { font-weight: 750; }
.sec-sum { color: var(--muted); font: 500 .8rem var(--mono); }
.sec-caret { margin-left: auto; width: 9px; height: 9px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); transition: transform .15s; }
.sec[open] .sec-caret { transform: rotate(225deg); }
.sec[open] > summary { border-bottom: 1px solid var(--glass-line); }
.sec-body { padding: var(--s4); display: grid; gap: var(--s3); min-width: 0; }
.sub { font: 650 .72rem var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-top: var(--s2); }

/* Timeline lists */
.timeline { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.timeline li { display: grid; grid-template-columns: 5.6rem minmax(0, 1fr); gap: var(--s3); padding: 7px 0; border-top: 1px solid var(--glass-line); }
.timeline li:first-child { border-top: 0; }
.timeline .t { font: 600 .8rem var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 1px; }
.timeline .e { display: grid; gap: 1px; font-weight: 600; overflow-wrap: anywhere; }
.timeline small { color: var(--muted); font-weight: 500; font-size: .8rem; }
.timeline.plan li { padding-left: 10px; border-left: 3px solid var(--field-line); }
.timeline.plan .k-event { border-left-color: var(--violet); }
.timeline.plan .k-deadline { border-left-color: var(--hard); }
.timeline.plan .k-study { border-left-color: var(--pref); }
.timeline.plan .k-typed, .timeline.plan .k-next, .timeline.plan .k-now, .timeline.plan .k-fixed { border-left-color: var(--accent); }
.timeline.plan .conflict small { color: var(--hard); }
.timeline.compact li { padding: 4px 0; grid-template-columns: 4.8rem minmax(0, 1fr); }
.week { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: var(--s3) var(--s5); }

/* Rows (Tasks, Areas, Plan) */
.rows { list-style: none; margin: 0; padding: 0; display: grid; }
.row { display: flex; align-items: center; gap: var(--s3); padding: 11px 0; border-top: 1px solid var(--glass-line); flex-wrap: wrap; }
.row:first-child { border-top: 0; }
.row-main { flex: 1 1 220px; min-width: 0; display: grid; gap: 3px; }
.row-title { font-weight: 650; overflow-wrap: anywhere; }
.row-meta { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; font-size: .82rem; color: var(--muted); }
.row.done .row-title { text-decoration: line-through; color: var(--muted); }
.row-acts { display: flex; gap: 6px; flex-wrap: wrap; }
.row select { width: auto; min-width: 7.5rem; }
.tick { flex: none; width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--muted); background: transparent; cursor: pointer; position: relative; }
.tick::after { content: ""; position: absolute; inset: -10px; }
.tick:hover { border-color: var(--accent); box-shadow: 0 0 12px var(--accent-glow); }
.tick.on { background: var(--accent); border-color: var(--accent); }
.list-card { padding: var(--s2) var(--s5); }
.seg { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.seg button { appearance: none; border: 1px solid var(--glass-line); background: var(--glass); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); color: var(--muted); font: 650 .86rem var(--font); padding: 8px 15px; border-radius: 99px; min-height: 40px; cursor: pointer; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.seg button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

/* Forms */
input, select, textarea { width: 100%; font: inherit; color: var(--ink); background: var(--field); border: 1px solid var(--field-line); border-radius: 10px; padding: 9px 11px; min-height: 44px; }
input::placeholder, textarea::placeholder { color: var(--faint); }
select option { background: var(--bg); color: var(--ink); }
textarea { resize: vertical; min-height: 80px; }
label { font-size: .84rem; font-weight: 650; color: var(--muted); display: grid; gap: 5px; }
fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: var(--s2); }
legend { font-size: .84rem; font-weight: 700; color: var(--muted); margin-bottom: var(--s2); }
.stack { display: grid; gap: var(--s3); }
.grid-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--s3); align-items: end; }
.inline { display: flex; gap: var(--s2); align-items: center; }
.inline input { min-height: 36px; padding: 6px 10px; }
.choices { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: var(--s2); }
.choice { display: flex; gap: 8px; align-items: center; padding: 10px 12px; border: 1px solid var(--field-line); border-radius: 10px; color: var(--ink); font-weight: 600; cursor: pointer; background: var(--field); }
.choice input, .row input[type=checkbox], .chip-btn input { width: 18px; height: 18px; min-height: 0; accent-color: var(--accent); margin: 0; }
.chips-row { display: flex; gap: 6px; flex-wrap: wrap; }
.chip-btn { appearance: none; border: 1px solid var(--field-line); background: var(--field); color: var(--ink); font: 650 .86rem var(--font); padding: 8px 13px; border-radius: 99px; min-height: 40px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.chip-btn.on, .chip-btn:has(input:checked) { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.ask, .confirm { background: var(--warn-soft); border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); border-radius: 12px; padding: var(--s3); display: grid; gap: var(--s2); }
.figs { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--s3); margin: 0; }
.figs div { background: var(--field); border: 1px solid var(--glass-line); border-radius: 12px; padding: var(--s3); }
.figs dt { font: 600 .68rem var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.figs dd { margin: 4px 0 0; font: 750 1.15rem var(--mono); font-variant-numeric: tabular-nums; }
.paste summary { cursor: pointer; font-weight: 650; color: var(--accent); }

/* Review */
.score { padding: var(--s5); display: grid; gap: var(--s3); }
.score-num { display: flex; align-items: baseline; gap: var(--s3); color: var(--muted); font-weight: 600; }
.score-num .big { font: 800 3rem/1 var(--mono); color: var(--ink); font-variant-numeric: tabular-nums; }
.bar { height: 10px; background: var(--ring-track); border-radius: 99px; overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--accent); box-shadow: 0 0 14px var(--accent-glow); }
.past { display: grid; gap: 4px; padding-top: var(--s2); border-top: 1px solid var(--glass-line); }

/* Sources */
.src-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: var(--s3); }
.src { padding: var(--s4); display: grid; gap: var(--s2); align-content: start; border-radius: 14px; box-shadow: none; }
.src-head { display: flex; justify-content: space-between; gap: var(--s2); flex-wrap: wrap; align-items: baseline; }
.src h3 { font-size: .98rem; }

/* Welcome */
.welcome { padding: clamp(22px, 4vw, 44px); display: grid; gap: var(--s4); max-width: 760px; }
.welcome .greet { font-size: clamp(2rem, 4.4vw, 3.2rem); max-width: 20ch; }
.lede { color: var(--muted); font-size: 1.02rem; max-width: 60ch; }
.steps { margin: 0; padding-left: 1.3rem; display: grid; gap: var(--s2); }

/* Sheets */
.backdrop { position: fixed; inset: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 55%, transparent); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet { width: min(560px, 100%); max-height: 100%; overflow: auto; background: var(--glass-strong); padding: var(--s5); display: grid; gap: var(--s4); }
.sheet header { display: flex; justify-content: space-between; align-items: center; }
.sheet h2 { font-size: 1.2rem; }
.x { appearance: none; border: 1px solid var(--field-line); background: var(--field); color: var(--ink); width: 40px; height: 40px; border-radius: 50%; font-size: 1rem; cursor: pointer; }
.done-msg { font-size: 1.05rem; }

/* Toast */
.toast { position: fixed; left: 50%; top: calc(76px + env(safe-area-inset-top, 0px)); transform: translate(-50%, -12px); opacity: 0; pointer-events: none; background: var(--glass-strong); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border: 1px solid var(--accent); color: var(--ink); padding: 10px 16px; border-radius: 99px; font-weight: 650; font-size: .9rem; display: flex; gap: 12px; align-items: center; z-index: 30; transition: opacity .2s, transform .2s; max-width: calc(100vw - 32px); box-shadow: 0 0 30px -8px var(--accent-glow); }
.toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }

@media (min-width: 761px) { #app { padding-bottom: 0; } }
@media (max-width: 1080px) {
  .sky-head { grid-template-columns: minmax(0, 1fr); gap: var(--s4); }
  .inst-assign, .inst-money, .inst-fit, .inst-follow { grid-column: span 6; grid-row: auto; }
}
@media (max-width: 760px) {
  .nav { display: none; }
  .top { margin-inline: max(10px, env(safe-area-inset-left, 0px)); padding: 6px 8px 6px 12px; }
  .top .btn span { display: none; }
  .tabbar { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: max(10px, env(safe-area-inset-left, 0px)); right: max(10px, env(safe-area-inset-right, 0px)); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 8; padding: 6px; border-radius: 18px; background: var(--glass-strong); }
  .tabbar a { justify-content: center; font-size: .78rem; padding: 6px 2px; }
  main { padding-top: var(--s4); gap: var(--s4); }
  .demo-band .long { display: none; }
  .demo-band .short { display: inline; }
  .greet { font-size: 1.9rem; }
  .open { gap: var(--s3); padding-top: 0; }
  .stamp-line .sys { display: none; }
  .hero { padding: var(--s4); gap: var(--s2); }
  .hero .btn.ghost, .hero .then { display: none; }
  .hero-title { font-size: 1.3rem; }
  .dock { flex-wrap: nowrap; overflow-x: auto; margin-inline: -4px; padding: 2px 4px; scrollbar-width: none; }
  .dock .pill { flex: none; min-height: 40px; padding: 6px 13px; font-size: .85rem; }
  .rail { padding: var(--s4); gap: var(--s3); }
  .rail-top { display: none; }
  .glance { padding-top: var(--s3); }
  .glance:first-of-type { border-top: 0; padding-top: 0; }
  .glance .lines { gap: 4px; }
  .glance .lines li { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px; }
  .glance .lines li > :first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ribbon { padding: var(--s4); }
  .instruments { grid-template-columns: minmax(0, 1fr); gap: var(--s5); }
  .inst-assign, .inst-money, .inst-fit, .inst-follow { grid-column: auto; grid-row: auto; }
  .track, .ribbon-foot .fine:first-child { display: none; }
  .timeline.ribbon-list { display: grid; }
  .inst.glass { padding: var(--s4); }
  .page-head { flex-wrap: nowrap; align-items: center; }
  .page-head .eyebrow { display: none; }
  .page-title { font-size: 1.9rem; }
}

/* Usability pass: targets, headings in summaries, banners */
h2.sec-title { font-size: 1rem; font-weight: 750; letter-spacing: 0; }
.rail .lines a, .inst header a, .ribbon-src a, .link, .paste summary { display: inline-block; padding-block: 4px; }
.toast .link { color: var(--ink); background: var(--field); border: 1px solid var(--field-line); text-decoration: none; padding: 6px 14px; border-radius: 99px; min-height: 34px; }
.ribbon-src { display: inline-flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.row-banner { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }

/* Live sync */
.connect-cta { display: grid; gap: var(--s3); max-width: 62ch; }
.live-src.st-live { border-color: color-mix(in srgb, var(--ok) 45%, var(--glass-line)); }
.live-src.st-approval, .live-src.st-retrying { border-color: color-mix(in srgb, var(--warn) 45%, var(--glass-line)); }

/* ===== Calm answer view ===== */
.calm { display: grid; gap: var(--s5); max-width: 760px; width: 100%; margin-inline: auto; padding-top: var(--s4); }
.calm .greet { max-width: none; }
.ask-box { display: grid; gap: var(--s3); padding: var(--s5); border-radius: 24px; background: var(--glass-strong); border: 1px solid var(--glass-line); -webkit-backdrop-filter: blur(var(--blur)); backdrop-filter: blur(var(--blur)); box-shadow: 0 24px 70px rgba(0, 0, 0, .28); }
.ask-box > label { font: 750 1.15rem var(--font); color: var(--ink); letter-spacing: -.01em; }
.ask-box textarea { font-size: 1.05rem; line-height: 1.55; min-height: 96px; background: transparent; border: 0; border-bottom: 1px solid var(--field-line); border-radius: 0; padding: 4px 0 10px; resize: vertical; }
.ask-box textarea:focus-visible { outline: none; border-bottom-color: var(--accent); box-shadow: 0 1px 0 var(--accent); }
.ask-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s3) var(--s4); }
.ask-mode { flex: 1 1 260px; }
.thinking { display: inline-flex; align-items: center; gap: 10px; font-weight: 650; color: var(--ink); }
.pulse { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 0 var(--accent-glow); animation: pulse 1.4s ease-out infinite; }
@keyframes pulse { to { box-shadow: 0 0 0 14px transparent; } }
.quiet-next { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; padding: 0 var(--s2); }
.quiet-next .hud { color: var(--accent); }

.answer { display: grid; gap: var(--s5); padding: var(--s5) var(--s5) var(--s4); border-radius: 24px; background: var(--glass); border: 1px solid var(--glass-line); -webkit-backdrop-filter: blur(var(--blur)); backdrop-filter: blur(var(--blur)); }
.summary { font-size: clamp(1.15rem, 2.2vw, 1.35rem); line-height: 1.55; font-weight: 500; max-width: 62ch; text-wrap: pretty; }
.question { padding: var(--s3) var(--s4); border-radius: 14px; background: var(--warn-soft); }
.question .hud { color: var(--warn); margin-right: 6px; }
.next-step { display: grid; gap: 4px; padding-left: var(--s4); border-left: 3px solid var(--accent); }
.next-step .hud { color: var(--accent); }
.next-title { font: 800 clamp(1.3rem, 2.6vw, 1.7rem)/1.2 var(--font); letter-spacing: -.02em; }
.staged { display: grid; gap: var(--s3); }
.acts { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--s2); }
.act { display: grid; grid-template-columns: 5.4rem minmax(8.5rem, 1fr) auto; gap: var(--s3); align-items: start; padding: var(--s3) var(--s4); border-radius: 14px; background: var(--field); border: 1px solid var(--glass-line); }
.act-type { font: 700 .7rem var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding-top: 4px; }
.t-task .act-type { color: var(--accent); }
.t-event .act-type { color: var(--violet); }
.t-email .act-type { color: var(--teal); }
.act-main { display: grid; gap: 3px; min-width: 0; }
.act-title { font-weight: 700; overflow-wrap: break-word; }
.act-meta { font: 500 .8rem var(--mono); color: var(--muted); overflow-wrap: break-word; word-break: normal; }
.act-meta .nw { white-space: nowrap; } /* "Tomorrow", "7:00 PM–8:00 PM" never split */
.act-why { font-size: .86rem; color: var(--muted); }
.act-result { font-size: .86rem; font-weight: 650; color: var(--ok); }
.act-btns { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.act.s-done { border-color: color-mix(in srgb, var(--ok) 45%, var(--glass-line)); }
.act.s-done .act-title { color: var(--muted); }
.act.s-skipped { opacity: .62; }
.act.s-check .act-result { color: var(--warn); }
.act.s-failed .act-result { color: var(--hard); }
.act.editing { display: block; }
.draft summary { cursor: pointer; font-size: .84rem; font-weight: 650; color: var(--accent); padding-block: 4px; }
.draft pre { white-space: pre-wrap; font: .9rem/1.5 var(--font); margin: 6px 0 0; padding: var(--s3); background: var(--glass-strong); border-radius: 10px; border: 1px solid var(--glass-line); }
.plan-list { display: grid; gap: var(--s2); }
.left-out { display: grid; gap: var(--s2); padding: var(--s3) var(--s4); border-radius: 14px; background: var(--warn-soft); }
.undo-line { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--s2) var(--s3); padding: 8px 8px 8px var(--s4); border-radius: var(--r-sm); border: 1px solid var(--accent); background: var(--glass-strong); font-weight: 650; }
.left-out .hud { color: var(--warn); }
.left-out .meta { white-space: normal; text-align: right; }
.act-why.warn { color: var(--warn); font-weight: 650; }
.plan-list ol { list-style: none; margin: 0; padding: 0; display: grid; }
.plan-list li { display: grid; grid-template-columns: 5.4rem minmax(0, 1fr); gap: var(--s3); padding: 8px 0 8px 12px; border-left: 2px solid var(--field-line); }
.plan-list li.k-focus { border-left-color: var(--accent); }
.plan-list li.k-event { border-left-color: var(--violet); }
.plan-list li.k-break { border-left-color: var(--faint); }
.plan-list li.past { opacity: .55; }
.plan-list .t { font: 600 .8rem var(--mono); color: var(--muted); padding-top: 2px; }
.plan-list .e { display: grid; font-weight: 650; overflow-wrap: anywhere; }
.plan-list small { font-weight: 500; color: var(--muted); font-size: .78rem; }
.answer-foot { border-top: 1px solid var(--glass-line); padding-top: var(--s3); }
.everything-sec { max-width: 1240px; width: 100%; margin-inline: auto; }
.everything { display: grid; gap: var(--s5); }
.everything .sky-head { grid-template-columns: minmax(0, 1fr) minmax(280px, 360px); }
@media (max-width: 760px) {
  .calm { gap: var(--s4); padding-top: 0; }
  .ask-box, .answer { padding: var(--s4); border-radius: 18px; }
  .act { grid-template-columns: minmax(0, 1fr); }
  .act-btns { justify-content: flex-start; }
  .everything .sky-head { grid-template-columns: minmax(0, 1fr); }
  .everything .hero .then { display: grid; }
}
.quick { display: flex; flex-wrap: wrap; gap: 4px 20px; padding: 0 var(--s2); margin-top: calc(-1 * var(--s2)); }
.quick .link { color: var(--muted); text-decoration-color: var(--field-line); font-weight: 600; }
.quick .link:hover { color: var(--ink); text-decoration-color: var(--accent); }

/* Appearance (Options → Look). The app sets data-scheme (resolved light/dark), data-accent, data-bg and
   data-motion on <html>. Every pair below was checked for AA contrast: accent vs its ink, and accent vs the page. */
:root[data-scheme="dark"][data-accent="violet"] { --accent: #b9a6ff; --accent-ink: #140b33; --accent-glow: rgba(185, 166, 255, 0.35); }

/* Look controls */
.look { display: grid; gap: var(--s4); }
.look fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: var(--s2); }
.look legend { font-weight: 650; margin-bottom: var(--s2); padding: 0; }
.look .seg { flex-wrap: wrap; overflow: visible; }
.swatches { display: flex; flex-wrap: wrap; gap: 10px; }
.swatch { appearance: none; width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--glass-line); background: var(--sw); cursor: pointer; position: relative; box-shadow: inset 0 0 0 3px var(--glass-strong); }
.swatch[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 3px var(--glass-strong), 0 0 0 2px var(--sw); }
.swatch[aria-pressed="true"]::after { content: "✓"; position: absolute; inset: 0; display: grid; place-items: center; color: var(--ink); font: 800 1rem var(--font); text-shadow: 0 0 4px var(--glass-strong); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px; }
.tile { appearance: none; border: 2px solid var(--glass-line); border-radius: var(--r-sm); padding: 0; cursor: pointer; overflow: hidden; background: var(--glass); color: var(--ink); font: 650 .82rem var(--font); display: grid; text-align: left; }
.tile i { display: block; height: 46px; background: var(--tile); }
.tile span { padding: 6px 10px; }
.tile[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }

/* ---------- Today v3: four answers, Next up card, calendar line, named sections ---------- */
.qa-wrap { display: grid; gap: var(--s3); }
.qa-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.qa { appearance: none; display: grid; gap: 2px; justify-items: start; text-align: left; padding: 10px 12px; min-height: 64px; border-radius: var(--r-sm); border: 1px solid var(--glass-line); background: var(--glass); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); color: var(--ink); cursor: pointer; font: inherit; }
.qa b { font: 750 1.35rem/1.1 var(--mono); }
.qa span { font: 650 .78rem var(--font); color: var(--muted); letter-spacing: .02em; }
.qa:hover { border-color: var(--accent); }
.qa.on { border-color: var(--accent); box-shadow: inset 0 -3px 0 var(--accent); }
.qa.late b { color: var(--hard); }
.qa.warn b { color: var(--pref); }
.qa.cap-light, .qa.cap-full, .qa.cap-overloaded { background: var(--glass); }
.qa.cap-light b { color: var(--ok); } .qa.cap-full b { color: var(--pref); } .qa.cap-overloaded b { color: var(--hard); }
.qa.cap-light b, .qa.cap-full b, .qa.cap-overloaded b { font-size: 1.05rem; padding-top: 4px; }
.qa-panel { padding: var(--s3) var(--s4); border-radius: var(--r-sm); background: var(--glass-strong); border: 1px solid var(--glass-line); }
.lines.ticks li { align-items: center; flex-wrap: nowrap; }
.lines.ticks li > :first-child { flex: 1; }
.all-clear { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; padding: 12px var(--s4); border-radius: var(--r-sm); background: var(--ok-soft); font-weight: 650; }
.next-card { display: grid; gap: 6px; padding: var(--s4); border-radius: var(--r); background: linear-gradient(135deg, color-mix(in srgb, var(--glass-strong) 92%, var(--accent)), var(--glass-strong)); border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--glass-line)); -webkit-backdrop-filter: blur(var(--blur)); backdrop-filter: blur(var(--blur)); }
.next-card .hud { color: var(--accent); }
.next-title { font: 750 1.15rem/1.3 var(--font); }
.next-meta { color: var(--muted); font-size: .9rem; }
.next-card .actions { margin-top: 4px; align-items: center; }
.connect-line { display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: center; padding: 10px var(--s4); border-radius: var(--r-sm); border: 1px dashed var(--field-line); color: var(--muted); }
.connect-line span { color: var(--ink); }
.link.quiet { color: var(--muted); font-weight: 500; }
.today-secs { display: grid; gap: var(--s3); max-width: 760px; width: 100%; margin: var(--s5) auto 0; }
.today-secs .ribbon, .today-secs .inst-assign, .today-secs .inst-follow { padding: 0; display: grid; gap: var(--s3); }
.sec-src { display: flex; justify-content: flex-end; }
@media (max-width: 420px) { .qa { padding: 8px 9px; min-height: 58px; } .qa b { font-size: 1.15rem; } .qa.cap-light b, .qa.cap-full b, .qa.cap-overloaded b { font-size: .92rem; } }
